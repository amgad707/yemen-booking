<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وجهتي - لحجز الفنادق والمطاعم في اليمن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="container header-content">
            <h1 class="logo">وجهتي <span>اليمن</span></h1>
            <nav>
                <a href="#places">الأماكن</a>
            </nav>
        </div>
    </header>

    <!-- قسم البحث الرئيسي -->
    <section class="hero">
        <div class="container">
            <h2>اكتشف واحجز أفضل الفنادق والمطاعم في اليمن</h2>
            <p>أسعار واضحة، حجز فوري عبر الواتساب، وتجربة سهلة في جميع المحافظات</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث باسم الفندق أو المطعم...">
                <select id="cityFilter">
                    <option value="all">كل المدن</option>
                    <option value="صنعاء">صنعاء</option>
                    <option value="عدن">عدن</option>
                    <option value="تعز">تعز</option>
                    <option value="المكلا">المكلا</option>
                    <option value="إب">إب</option>
                </select>
                <select id="typeFilter">
                    <option value="all">الكل (فنادق ومطاعم)</option>
                    <option value="فندق">فنادق</option>
                    <option value="مطعم">مطاعم</option>
                </select>
            </div>
        </div>
    </section>

    <!-- قسم عرض الأماكن -->
    <section id="places" class="container places-section">
        <h3>الأماكن المتاحة للحجز</h3>
        <div id="placesGrid" class="places-grid">
            <!-- البطاقات تظهر هنا تلقائياً من قاعدة البيانات -->
        </div>
    </section>

    <!-- نافذة تفاصيل المكان -->
    <div id="detailsModal" class="modal">
        <div class="modal-content details-box">
            <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
            <img id="detailImage" src="" alt="صورة المكان" class="detail-img">
            <span id="detailBadge" class="badge"></span>
            <h3 id="detailName" style="margin-top: 10px;"></h3>
            <p id="detailAddress" class="detail-address"></p>
            <p id="detailDesc" class="detail-desc"></p>
            
            <h4>الخدمات والمميزات:</h4>
            <div id="detailFeatures" class="features-list"></div>
            
            <div class="detail-footer">
                <span id="detailPrice" class="price"></span>
                <div class="detail-actions">
                    <a id="detailMapLink" href="#" target="_blank" class="btn-secondary">📍 الموقع على الخريطة</a>
                    <button id="detailBookBtn" class="btn-primary">احجز الآن</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الحجز عبر الواتساب -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeBookingModal()">&times;</span>
            <h3 id="modalTitle">حجز جديد</h3>
            <p style="font-size: 13px; color: #666; margin-top: 5px;">سيتم حفظ طلبك وتحويلك إلى الواتساب لتأكيد الحجز مباشرة</p>
            <form id="bookingForm">
                <label>الاسم الكامل:</label>
                <input type="text" id="customerName" required placeholder="أدخل اسمك الثلاثي">
                
                <label>رقم الجوال:</label>
                <input type="tel" id="customerPhone" required placeholder="77xxxxxxx">
                
                <label>تاريخ الحجز:</label>
                <input type="date" id="bookingDate" required>

                <label>عدد الأشخاص / الغرف:</label>
                <input type="number" id="guestsCount" min="1" value="1" required>
                
                <button type="submit" class="btn-whatsapp">إرسال الطلب عبر واتساب 💬</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
